name: Container

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # schedule:
  #   - cron: '0 3 1 * *'

  workflow_dispatch:

  # run it on push to the default repository branch
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: "docker.io/"

jobs:
  # define job to build and publish container image
  build-and-push-container-image:
    name: Build container image and push to repositories
    runs-on: ubuntu-24.04

    # provide a local container registry
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
  
    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Buildah
        run: sudo apt-get update && sudo apt-get -y install --no-install-recommends buildah

      - name: Build intermediate Xpra image
        uses: redhat-actions/buildah-build@v2
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./xpra
          containerfiles: ./xpra/containerfile
          image: localhost:5000/averbeck/xpra-base
          # Note: tags has to be all lower-case
          tags: latest
          extra-args: |
            --network=host

      - name: List available images
        run: podman image ls

      - name: Build JDownloader image
        id: build-jdownloader-image
        uses: redhat-actions/buildah-build@v2
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./jdownloader
          containerfiles: ./jdownloader/containerfile
          # Note: tags has to be all lower-case
          image: averbeck/jdownloader-xpra
          tags: latest
          build-args: |
            REGISTRY=localhost:5000
          extra-args: |
            --network=host

      # Podman Login action (https://github.com/redhat-actions/podman-login) also be used to log in,
      # in which case 'username' and 'password' can be omitted.
      - name: Push image to Docker Hub
        id: push-to-docker-hub
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-jdownloader-image.outputs.image }}
          tags: ${{ steps.build-jdownloader-image.outputs.tags }}
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-docker-hub.outputs.registry-paths }}"

      - name: Push image to GitHub Container Registry
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-jdownloader-image.outputs.image }}
          tags: ${{ steps.build-jdownloader-image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-ghcr.outputs.registry-paths }}"
